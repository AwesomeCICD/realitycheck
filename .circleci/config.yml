version: 2.1

executors:
  docker-default:
    docker:
      - image: cimg/base:current
  ubuntu-cloud:
    machine:
      image: ubuntu-2404:current

  context-default: 
    docker:
      - image: cimg/base:current
    working_directory: /a/contexts/test

  workspace-default: 
    docker:
      - image: cimg/base:current
    working_directory: ~/foo/bar

commands:
  docker-job-default-command:
    steps:
      - run:
          name: verify required Environment Variables
          command: |
            if [ -z "${CIRCLE_HOSTNAME}" -o -z "${CIRCLE_TOKEN}" ];then
              echo "You must provide 2 Environment Variables in project settings for this job to run."
              echo "CIRCLE_HOSTNAME: Should be the scheme://domain of your install. \"https://ci.example.com\""
              echo "CIRCLE_TOKEN: Should be the API Key of an admin or project level with Scope:All"
              exit 1
            fi
      - run:
          name: verify that job ran with the requested resource_class option
          command: |
            curl -k \
            "${CIRCLE_HOSTNAME%/}/api/v1.1/project/github/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/$CIRCLE_BUILD_NUM?\
            circle-token=$CIRCLE_TOKEN" | \
            jq '.picard.resource_class.class' | grep $CIRCLE_JOB


basic_docker_build: 
  steps:
    - run:
        name: "Build a really basic docker image"
        command: |
          dockerfile=Dockerfile
          echo "FROM alpine:latest" > $dockerfile
          echo "RUN echo hello" >> $dockerfile
          docker build -f $dockerfile --tag throwaway:$CIRCLE_BUILD_NUM .
          docker run --rm throwaway:$CIRCLE_BUILD_NUM

jobs:
  docker-small:
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: small
    steps:
      - checkout
      - docker-job-default-command

  docker-medium: # 2 vCPUs, 4GB RAM
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: medium
    steps:
      - docker-job-default-command

  docker-medium-plus: # 3 vCPUs, 6GB RAM
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: medium+
    steps:
      - docker-job-default-command
   
  docker-large: # 4 vCPUs, 8GB RAM
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: large
    steps:
      - docker-job-default-command

  docker-xlarge: # 8 vCPUs, 16GB RAM
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: xlarge
    steps:
      - docker-job-default-command

  docker-2xlarge: # 8 vCPUs, 16GB RAM
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: 2xlarge
    steps:
      - docker-job-default-command

  docker-2xlarge-plus: # 8 vCPUs, 16GB RAM
    executor: docker-default # 1 vCPU, 2GB RAM
    resource_class: 2xlarge+
    steps:
      - docker-job-default-command

  # vm jobs
  machine:
    executor: ubuntu-cloud
    steps:
      - run: |
          echo $SLEEP
          date
          sleep $SLEEP
          date
          echo 'Done sleeping.'
    environment:
      SLEEP: 1
  
  android_machine:
    machine:
      image: android:edge
    steps:
      - run: |
          echo $SLEEP
          date
          sleep $SLEEP
          date
          echo 'Done sleeping.'
    environment:
      SLEEP: 1

  aws_arm:
    executor: ubuntu-cloud
    resource_class: arm.medium
    steps:
      - run: |
          echo $SLEEP
          date
          sleep $SLEEP
          date
          echo 'Done sleeping.'
    environment:
      SLEEP: 1

  remote_docker:
    executor: docker-default
    steps:
      - run: which docker
      - run: docker -v
      - setup_remote_docker
      - run: docker version

  docker_layer_caching:
    executor: docker-default
    steps:
      - run: which docker
      - run: docker -v
      - setup_remote_docker
      - run: docker version

  machine_dlc:
    executor: ubuntu-cloud
    steps:
      - run: which docker
      - run: docker -v
      - run: docker version

  # feature jobs
  contexts:
    executor: context-default
    steps:
      - run: env | grep CONTEXT_END_TO_END_TEST_VAR

  multi-contexts:
    executor: context-default
    steps:
      - run: env | grep MULTI_CONTEXT_END_TO_END_VAR

  write_workspace:
    executor: workspace-default
    steps:
      - run: mkdir stuff
      - run: echo 5 >./stuff/thing
      - persist_to_workspace:
          root: .
          paths:
            - stuff

  read_workspace:
    executor: workspace-default
    steps:
      - attach_workspace:
           at: ./attached
      - run: |
          if [[ $(< ./attached/stuff/thing) != '5' ]]; then
            echo 'Sadness, the value is not what we expected, so the workspace write/read did not work'
            exit 1
          else
            echo 'Yay, value matches'
            exit 0
          fi

  save_and_restore_cache:
    docker:
      - image: cimg/base:stable
    working_directory: ~/realitycheck
    steps:
      - checkout

      - run: mkdir -p stuff
      - run: echo 5 >./stuff/thing

      - save_cache:
          key: v3-file-cache-{{ .BuildNum }}
          paths:
            - ./stuff/thing

      - run: rm -rf ./stuff/thing
      - run: sleep 5

      - restore_cache:
            keys:
              - v3-file-cache-{{ .BuildNum }}

      - run: |
            if [[ $(< stuff/thing) != '5' ]]; then
              exit 1
            else
              echo "The cache was populated"
            fi

  artifacts_test_results:
    docker:
      - image: cimg/base:current
    working_directory: ~/realitycheck
    steps:
      - checkout

      - run:
          name: Creating Dummy Artifacts
          command: |
            echo "my artifact file" > /tmp/artifact-1.txt;
            mkdir /tmp/artifacts;
            echo "my artifact files in a dir" > /tmp/artifacts/artifact-2.txt;

      - store_artifacts:
          path: /tmp/artifact-1.txt
          destination: artifact-file.txt

      - store_artifacts:
          path: /tmp/artifacts

      - store_test_results:
          path: test-results

workflows:
  resource_class_jobs:
    jobs:
      - docker-medium-plus
      - docker-small
      - docker-medium
      - docker-large
      - docker-xlarge

  vm_jobs:
    jobs:
      - machine
      - remote_docker
      - docker_layer_caching
      - machine_dlc
  
  aws_jobs:
    jobs:
      - aws_arm
  
  gcp_jobs:
    jobs:
      - android_machine

  feature_jobs:
    jobs:
      - save_and_restore_cache
      - contexts:
          context: org-global
      - multi-contexts:
          context: individual-local
      - write_workspace
      - read_workspace:
          requires:
            - write_workspace
      - artifacts_test_results
